# Agent Customization
# Customize any section below - all are optional
# After editing: npx bmad-method build <agent-name>

# Override agent name
agent:
  metadata:
    name: ""

# Replace entire persona (not merged)
persona:
  role: ""
  identity: ""
  communication_style: ""
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions: []

# Add persistent memories for the agent
memories: []
# Example:
# memories:
#   - "User prefers detailed technical explanations"
#   - "Current project uses React and TypeScript"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu:
  - trigger: write_to_file
    workflow: "{project-root}/.bmad/core/workflows/secure-tools/write_to_file.yaml"
    description: "Securely write content to a file with user confirmation."
  - trigger: execute_command
    workflow: "{project-root}/.bmad/core/workflows/secure-tools/execute_command.yaml"
    description: "Securely execute a command with user confirmation."
  - trigger: plan_sprint
    workflow: "{project-root}/.bmad/core/workflows/collaborative-sprint-planning.yaml"
    description: "Start a new collaborative sprint plan."
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
