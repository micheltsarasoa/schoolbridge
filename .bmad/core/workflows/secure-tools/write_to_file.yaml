id: secure-write-to-file
name: Secure Write to File
description: Wraps the write_to_file tool to require user confirmation.

variables:
  - name: path
    type: string
    description: The path of the file to write to.
  - name: content
    type: string
    description: The content to write to the file.

steps:
  - id: confirm-write
    tool: ask_followup_question
    input:
      question: "An agent wants to write to the file '{{path}}'. Do you approve?"
      follow_up:
        - suggest: "Yes, proceed."
        - suggest: "No, cancel."

  - id: execute-write
    tool: write_to_file
    input:
      path: "{{path}}"
      content: "{{content}}"
    condition: "'{{confirm-write.answer}}' == 'Yes, proceed.'"

  - id: notify-user
    tool: attempt_completion
    input:
      result: "File '{{path}}' has been written successfully."
    condition: "'{{confirm-write.answer}}' == 'Yes, proceed.'"

  - id: cancel-write
    tool: attempt_completion
    input:
      result: "Write operation to '{{path}}' was cancelled by the user."
    condition: "'{{confirm-write.answer}}' == 'No, cancel.'"